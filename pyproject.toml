[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyscrape"
version = "0.1.0"
description = "yt-dlp ve gallery-dl ile medya indiren Python komut satırı ve arayüz aracı"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default,curl-cffi]>=2026.8.19",
    "gallery-dl>=1.26.0",
    "rich>=13.7.0",
    "httpx>=0.26.0",
    "mutagen>=1.47.0",
    "ytmusicapi>=1.3.2",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.3",
    "mypy>=1.8.0",
    "pytest>=7.4.4",
    "ruff>=0.2.1",
]

[project.scripts]
easyscrape = "easyscrape.cli:main"

[project.gui-scripts]
easyscrape-gui = "easyscrape.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/easyscrape"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "yt_dlp",
    "yt_dlp.*",
    "gallery_dl",
    "gallery_dl.*",
    "mutagen",
    "mutagen.*",
    "ytmusicapi",
    "ytmusicapi.*",
]
ignore_missing_imports = true
